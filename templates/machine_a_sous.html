<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine a sous</title>
</head>
<body>
    <h1>Bienvenue dans la machine a sous</h1>
    <p>Solde : {{ solde }}</p>

    <form action="" method="post">
        <input type="number" name="mise">
        <button name="action" value="commencer">Miser</button>
    </form>

    {% if tirage %}
        <p>tirage actuel : {{ tirage | join(" | ") }}</p>
    {% endif %}

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}

    <a href="/">Retour à l'accueil</a>
</body>
</html>
