<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crash</title>
</head>
<body>
    <h1>Bienvenue dans le crash</h1>
    <p>Solde : {{ solde }}</p>

    <form action="" method="post">
        <input type="number" name="mise"placeholder="votre mise">
        <input type="text" name="objectif" placeholder="votre objectif">
        <button name="action" value="commencer">Miser</button>
    </form>

    {% if crash_tire %}
        <p>crash actuel : {{ crash_tire }}</p>
    {% endif %}

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}

    <a href="/">Retour à l'accueil</a>
</body>
</html>
