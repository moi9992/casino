<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette</title>
</head>
<body>
    <h1>Bienvenue dans la Roulette</h1>
    <p>Solde : {{ solde }}</p>

    <form action="" method="post">
        <select name="choix_couleur">
            <option value="rouge">Rouge</option>
            <option value="noir">Noir</option>
        </select>
        <input type="number" name="mise_couleur" placeholder="mise sur la couleur">
        <input type="number" name="choix_numero" placeholder="numéro visé(0 à 36)">
        <input type="number" name="mise_numero" placeholder="mise sur le numéro">
        <select name="choix_parite">
            <option value="pair">Pair</option>
            <option value="impair">Impair</option>
        </select>
        <input type="number" name="mise_parite" placeholder="mise sur pair ou impair">
        <select name="choix_moitie">
            <option value="manque">Manque</option>
            <option value="passe">Passe</option>
        </select>
        <input type="number" name="mise_moitie" placeholder="mise sur manque ou passe">
        <select name="choix_douzaine">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
        </select>
        <input type="number" name="mise_douzaine" placeholder="mise sur la douzaine">
        <button>Lancer la roulette</button>
    </form>

    {% if numero is not none %}
    <p>numéro tirer : {{ numero }}</p>
    {% endif %}

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}

    <a href="/">Retour à l'accueil</a>
</body>
</html>
