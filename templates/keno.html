<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keno</title>
</head>
<body>
    <h1>Bienvenue dans le keno</h1>
    <p>Solde : {{ solde }}</p>

    <form action="" method="post">
        <input type="number" name="mise" placeholder="votre mise">
        <input type="text" name="numeros" placeholder="vos numéro">
        <button name="action" value="commencer">Miser</button>
    </form>

    {% if tirage %}
        <p>tirage actuel : {{ tirage | join(" ") }}</p>
    {% endif %}

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}

    {% include "pied_de_page.html" %}
</body>
</html>
